<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特案報告申請系統 — 銘勁汽車 MG</title>
<style>
:root {
  --primary: #1a5276;
  --primary-light: #2e86c1;
  --accent: #e67e22;
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #1a252f;
  --muted: #7f8c8d;
  --border: #d5dce4;
  --success: #1e8449;
  --info-bg: #eaf4fb;
  --shadow: 0 4px 24px rgba(26,82,118,.10);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.site-header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #fff;
  padding: 0 32px;
  height: 64px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
}
.logo {
  width: 38px; height: 38px; border-radius: 10px;
  background: rgba(255,255,255,.2);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 16px; letter-spacing: -.5px;
  flex-shrink: 0;
}
.brand-name { font-size: 18px; font-weight: 700; }
.brand-sub  { font-size: 12px; opacity: .7; margin-top: 1px; }

/* ── Main ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}

.welcome {
  text-align: center;
  margin-bottom: 48px;
}
.welcome-title {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 8px;
  letter-spacing: -.02em;
}
.welcome-sub {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.7;
}

/* ── Cards ── */
.card-row {
  display: flex;
  gap: 24px;
  justify-content: center;
  flex-wrap: wrap;
  width: 100%;
  max-width: 680px;
}

.entry-card {
  flex: 1;
  min-width: 240px;
  max-width: 300px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 36px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  cursor: pointer;
  text-decoration: none;
  color: var(--text);
  box-shadow: var(--shadow);
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.entry-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  border-radius: 16px 16px 0 0;
}
.entry-card.apply::before  { background: var(--primary); }
.entry-card.review::before { background: var(--accent); }

.entry-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 32px rgba(26,82,118,.15);
  border-color: transparent;
}
.entry-card.apply:hover  { border-color: var(--primary); }
.entry-card.review:hover { border-color: var(--accent); }

.card-emoji {
  font-size: 48px;
  margin-bottom: 20px;
  line-height: 1;
}
.card-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 10px;
}
.entry-card.review .card-title { color: var(--accent); }

.card-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 24px;
}
.card-btn {
  padding: 10px 28px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
  width: 100%;
}
.entry-card.apply  .card-btn { background: var(--primary); color: #fff; }
.entry-card.review .card-btn { background: var(--accent);  color: #fff; }
.entry-card.apply:hover  .card-btn { background: var(--primary-light); }
.entry-card.review:hover .card-btn { background: #f39c12; }

/* ── Notice ── */
.notice {
  margin-top: 40px;
  max-width: 520px;
  text-align: center;
  background: var(--info-bg);
  border: 1px solid #aed6f1;
  border-radius: 10px;
  padding: 14px 20px;
  font-size: 13px;
  color: var(--primary);
  line-height: 1.7;
}
.notice b { font-weight: 700; }

/* ── Footer ── */
.footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: var(--muted);
}

@media (max-width: 540px) {
  .card-row { flex-direction: column; align-items: center; }
  .entry-card { max-width: 100%; min-width: unset; width: 100%; }
  .welcome-title { font-size: 22px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">MG</div>
  <div>
    <div class="brand-name">銘勁汽車</div>
    <div class="brand-sub">特案報告申請系統</div>
  </div>
</header>

<main class="main">
  <div class="welcome">
    <div class="welcome-title">請選擇您要使用的功能</div>
    <div class="welcome-sub">依您的角色選擇對應頁面，系統將自動驗證您的身份</div>
  </div>

  <div class="card-row">
    <a class="entry-card apply" href="Application_Form_index.html">
      <div class="card-emoji">📋</div>
      <div class="card-title">特案申請</div>
      <div class="card-desc">填寫特案報告申請表單，送出後系統將依分類自動派送至對應簽核流程</div>
      <button class="card-btn">前往申請表單 →</button>
    </a>

    <a class="entry-card review" href="Approval_Form_review.html">
      <div class="card-emoji">✅</div>
      <div class="card-title">簽核審核</div>
      <div class="card-desc">審核待簽核的特案申請，進行核准、退回或要求補件等操作</div>
      <button class="card-btn">前往審核頁面 →</button>
    </a>
  </div>

  <div class="notice">
    <b>提醒：</b>兩個頁面皆需使用公司 Microsoft 365 帳號登入，系統將自動帶入您的姓名與所屬單位。
  </div>
</main>

<footer class="footer">
  銘勁汽車股份有限公司 · 特案報告申請系統 · 營業部內部使用
</footer>

</body>
</html>
